[workspace]
members = [
    "crates/nexrade-core",
    "crates/nexrade-server",
    "crates/nexrade-metrics",
    "crates/nexrade-tls",
    "crates/nexrade-lua",
    "crates/nexrade-plugin",
    "crates/nexrade-wasm",
    "nexrade-cli",
]
resolver = "2"

[workspace.package]
version = "1.4.2"
edition = "2021"
authors = ["Nexrade Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/nexrade/nexrade-cache"
description = "A high-performance Redis-compatible cache with Rust — with observability, TLS, Lua, WASM, and plugin support"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }

# Networking
bytes = { version = "1", features = ["serde"] }
futures = "0.3"

# Serialization
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
toml = "1.1"

# Error handling
thiserror = "1"
anyhow = "1.0.103"

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
prometheus = { version = "0.14", default-features = false, features = ["process"] }

# TLS
rustls = "0.23"
rustls-pki-types = "1"
tokio-rustls = "0.26"

# Lua
mlua = { version = "0.9", features = ["lua54", "vendored", "async"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Config
config = "0.14"

# UUID / ID gen
# `js` enables getrandom's JS backend on wasm32-unknown-unknown; ignored on other targets
uuid = { version = "1", features = ["v4", "js"] }

# dashmap for concurrent access
dashmap = "6"

# parking_lot — send_guard so RwLockWriteGuard is Send (0.5.0 MSET Option B foundation)
parking_lot = { version = "0.12", features = ["send_guard"] }

# ordered-float for sorted sets
ordered-float = { version = "5", features = ["serde"] }

# skiplist / sorted structures. `serde` is needed because `HashtableSet`
# persists an `IndexSet` (1.4.2 — see set_data.rs); indexmap serialises a set
# as a plain sequence, identical to what `HashSet` produced, so RDB/AOF files
# interoperate across that change.
indexmap = { version = "2", features = ["serde"] }

# foldhash — hasher for the per-shard key map (1.5.0). The std default is
# SipHash-1-3, which is DoS-resistant but slow; measured on 100k-key maps with
# randomised access it costs 60–179 ns per lookup vs 27–82 ns for foldhash, a
# ~54% saving on what profiling showed to be ~91% of a read's cost.
#
# Chosen over ahash (which measured marginally faster, −57% vs −55%) because
# foldhash has zero dependencies of its own and reaches this workspace only as
# a direct dependency. ahash arrives transitively via `config` → `rust-ini` →
# `ordered-multimap` → `hashbrown`, so its enabled feature set is not ours to
# control, and its randomness depends on which features are on.
#
# `foldhash::fast::RandomState` is seeded per-process (verified: the same key
# hashes differently across runs), so key-collision DoS is not a regression
# from the std default. Do NOT switch to `BuildHasherDefault<FoldHasher>` —
# that is the fixed-seed variant.
foldhash = "0.1"

# RESP protocol
atoi = "2"

# Persistence
bincode = { version = "2", features = ["serde"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
