name: Criterion benchmarks

on:
  push:
    branches: ["**"]
    paths:
      - "crates/nexrade-core/benches/**"
      - "crates/nexrade-core/src/**"
      - "crates/nexrade-core/Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/criterion.yml"
  pull_request:
    branches: ["**"]
    paths:
      - "crates/nexrade-core/benches/**"
      - "crates/nexrade-core/src/**"
      - "crates/nexrade-core/Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/criterion.yml"

concurrency:
  group: criterion-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── On every push / PR: just verify the benchmarks compile ─────────────────
  # Cheap (~1 min after cache warms). Catches benchmark code rot early.
  bench-compile:
    name: Benchmarks compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: bench-compile

      - name: Compile benchmarks (no run)
        run: cargo bench -p nexrade-core --bench store_bench --no-run

  # ── On pushes to main only: run all benchmarks and upload HTML reports ──────
  # Not run on PRs — avoids noisy 5-min runs on every feature branch push.
  bench-run:
    name: Benchmarks run + report
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: bench-run

      # The harness sets its own warm-up/measurement defaults (3s/10s) and a
      # 5% noise_threshold — see the module docs in store_bench.rs. We
      # deliberately do NOT override them here.
      #
      # This job previously passed `--warm-up-time 1 --measurement-time 3`
      # with a comment claiming that still produced "statistically valid
      # results". It does not: measured on an idle 24-core host, those
      # settings gave a ~15% spread across runs of an *unchanged* binary,
      # with criterion reporting "Performance has regressed (p = 0.00)" and
      # "Performance has improved (p = 0.01)" for the same code. The longer
      # defaults cut that to ~5%.
      - name: Run criterion benchmarks
        run: |
          # `--bench store_bench` is required: `cargo bench` without it
          # falls back to running the test binary (which has its own main and
          # no criterion parser). Verified by reproducing locally.
          cargo bench -p nexrade-core --bench store_bench \
            2>&1 | tee bench-output.txt

      # criterion writes HTML to target/criterion — upload the whole tree.
      - name: Upload criterion HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: criterion-report-${{ github.sha }}
          path: target/criterion
          retention-days: 90

      - name: Upload raw benchmark output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-output-${{ github.sha }}
          path: bench-output.txt
          retention-days: 90

      # Post a summary to the Actions job page.
      - name: Summarise results
        if: always()
        run: |
          echo "## Criterion benchmark results" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -E "^[a-zA-Z]|time:|thrpt:" bench-output.txt \
            | sed 's/^[ \t]*//' >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat >> $GITHUB_STEP_SUMMARY <<'NOTE'

          > **These numbers are indicative, not authoritative.**
          >
          > GitHub runners are shared and unpinned. Criterion's
          > `Performance has regressed (p < 0.05)` answers "did the samples
          > differ?", not "is the code slower?" — on a noisy host that comes
          > back positive for unchanged code. Runs of an identical binary
          > have reported both `+7.6% regressed` and `−5.3% improved`.
          >
          > **Do not open a performance issue from this page alone.**
          > Reproduce locally with a measured noise floor:
          >
          > ```
          > python3 scripts/bench_ab.py --noise-floor --pairs 8
          > python3 scripts/bench_ab.py --baseline main --pairs 8
          > ```
          >
          > See `docs/perf-methodology.md` § Criterion microbenchmarks.
          NOTE
