name: CI

on:
  push:
    branches: ["**"]
    paths:
      - "src/**"
      - "crates/**"
      - "nexrade-cli/**"
      - "fuzz/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "scripts/**"
      - "examples/**"
      - "nexrade.example.toml"
      - "nexrade.cache.toml"
      - "nexrade.production.toml"
      - "docs/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: ["**"]
    paths:
      - "src/**"
      - "crates/**"
      - "nexrade-cli/**"
      - "fuzz/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "scripts/**"
      - "examples/**"
      - "nexrade.example.toml"
      - "nexrade.cache.toml"
      - "nexrade.production.toml"
      - "docs/**"
      - ".github/workflows/ci.yml"

# Cancel stale runs on the same ref — never pay for an outdated run
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ─── Format check (ubuntu only — cheap, fast) ───────────────────────────────
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust stable + rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  # ─── Clippy lints (ubuntu only) ─────────────────────────────────────────────
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust stable + clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # Swatinem/rust-cache replaces the old hand-rolled actions/cache block:
      # it auto-prunes stale incremental-compilation fingerprints (which the
      # old `target`-directory cache let grow unbounded across months of
      # runs, slowing every restore) and skips saving on cache-hit, so it's
      # both faster to restore and doesn't bloat the cache indefinitely.
      - uses: Swatinem/rust-cache@v2
        with:
          key: clippy

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  # ─── Tests — Linux only ─────────────────────────────────────────────────────
  # macOS costs 10× and Windows costs 2× billed minutes.
  # Cross-platform compatibility is validated in the release workflow (tags only).
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: test

      # `--workspace --all-features` already exercises nexrade-core (and
      # every other crate); a separate `cargo test --package nexrade-core`
      # run added nothing but a second full test-suite execution.
      - name: Run all tests
        run: cargo test --workspace --all-features

  # ─── WASM target check ──────────────────────────────────────────────────────
  # `cargo build/test --workspace` builds every crate for the HOST target, so
  # it silently skips all `#[cfg(target_arch = "wasm32")]` branches. A missing
  # cfg gate on a wasm-gated item (e.g. importing `crate::replication`, which
  # is `#[cfg(not(wasm32))]`) therefore compiles fine on the host and only
  # breaks for wasm consumers.
  #
  # The full wasm-pack build lives in examples.yml, but that workflow is gated
  # to main/master — so on a feature branch the breakage stayed invisible
  # until after merge. This job is a cheap `cargo check` that runs on every
  # branch and catches the same class of error in ~1 min.
  wasm-check:
    name: WASM target check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # rust-toolchain.toml pins the channel to 1.87 and now lists
      # wasm32-unknown-unknown in its `targets`, so rustup provisions the
      # target for the pinned toolchain automatically. Installing for
      # `stable` here instead would be a no-op: the pin sends cargo back to
      # 1.87, which would then be missing the target ("can't find crate for
      # `core`"). Pinning the action to the same version keeps the two in
      # agreement.
      - name: Install Rust 1.87 + wasm32 target
        uses: dtolnay/rust-toolchain@1.87.0
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm-check

      - name: Check nexrade-core for wasm32
        run: cargo check -p nexrade-core --target wasm32-unknown-unknown

      - name: Check nexrade-wasm for wasm32
        run: cargo check -p nexrade-wasm --target wasm32-unknown-unknown --features wasm

  # ─── Python examples (fast subset) ──────────────────────────────────────────
  # The full examples suite lives in examples.yml, but that workflow is gated
  # to main/master because it takes ~20 min (wasm-pack compiles from source).
  # That gating let three real bugs ship green on feature branches:
  #   * SCAN cursor skipped half the keyspace when deleting mid-iteration —
  #     caught only by examples/11-python-patterns/patterns.py
  #   * HSCAN/SSCAN/ZSCAN carried the same flaw
  #   * nexrade-core stopped compiling for wasm32
  #
  # The Python examples are the cheap, high-signal part: they need only a
  # debug binary and a running server (no wasm-pack, no per-example cargo
  # builds), and they exercise real client behaviour that `cargo test` does
  # not. Running them on every branch costs ~2 min and closes the gap.
  # examples.yml keeps the heavy wasm/embedded/plugin coverage on main.
  python-examples:
    name: Python examples (fast subset)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: python-examples

      # Debug build, not --release: these examples only need the binary to
      # run correctly, and skipping lto/codegen-units=1 saves several minutes.
      - name: Build debug binaries
        run: cargo build --package nexrade-cache

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install redis-py
        run: pip install "redis>=5,<9"

      # nexrade-cli speaks the same RESP protocol as redis-cli; exposing it
      # under that name avoids a flaky apt-get install of redis-tools.
      - name: Expose nexrade-cli as redis-cli
        run: |
          mkdir -p /tmp/bin
          printf '#!/bin/bash\nexec "%s/target/debug/nexrade-cli" "$@"\n' \
            "$(pwd)" > /tmp/bin/redis-cli
          chmod +x /tmp/bin/redis-cli
          echo "/tmp/bin" >> $GITHUB_PATH

      - name: Run Python examples
        run: |
          set -euo pipefail
          ./target/debug/nexrade-cache --port 6379 --log-level warn &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 50); do
            if python3 -c "import socket; s=socket.create_connection(('127.0.0.1',6379),1); s.close()" 2>/dev/null; then
              break
            fi
            sleep 0.1
          done
          redis-cli ping

          # 03-pubsub needs a backgrounded subscriber.
          python3 examples/03-pubsub/subscriber.py news &
          SUB_PID=$!
          sleep 0.5
          python3 examples/03-pubsub/publisher.py
          sleep 0.5
          kill $SUB_PID 2>/dev/null || true

          python3 examples/04-transactions/atomic-ops.py
          python3 examples/06-streams/producer-consumer.py
          python3 examples/07-pipeline/benchmark.py
          # The SCAN-cursor regression surfaced here first.
          python3 examples/11-python-patterns/patterns.py

  # ─── Client wire smokes (1.0.0) ────────────────────────────────────────────
  # Three independent parsers against one release binary:
  #   1. scripts/redis_py_smoke.py          — redis-py sync + asyncio (31+5)
  #   2. scripts/redis_py_cluster_smoke.py  — cluster-client path safety (13)
  #   3. scripts/raw_resp_smoke.py          — raw TCP + hand-rolled RESP (10)
  # Fails the build on any miss.
  client-smokes:
    name: Client smokes (redis-py + cluster + raw RESP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: client-smokes

      - name: Build release nexrade-cache
        run: cargo build --release -p nexrade-cache

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install redis-py
        run: pip install "redis>=5,<9"

      - name: Start nexrade-cache and run all client smokes
        run: |
          set -euo pipefail
          PORT=16379
          ./target/release/nexrade-cache --port "$PORT" --metrics false --log-level warn &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for i in $(seq 1 50); do
            if python3 -c "import socket; s=socket.create_connection(('127.0.0.1',$PORT),1); s.close()" 2>/dev/null; then
              break
            fi
            sleep 0.1
          done
          python3 scripts/redis_py_smoke.py --host 127.0.0.1 --port "$PORT"
          python3 scripts/redis_py_cluster_smoke.py --host 127.0.0.1 --port "$PORT"
          python3 scripts/raw_resp_smoke.py --host 127.0.0.1 --port "$PORT"

  # ─── Operations drill (1.2.0) ────────────────────────────────────────────────
  # Validates the production profile end-to-end against the release
  # binary: print-config, preflight, clean start/health/ready/metrics,
  # clean shutdown, RDB restore, corrupt-AOF rejection, truncated-RDB
  # rejection, unavailable-path rejection, and (1.3.1) TLS — that a broken
  # TLS config is refused by both --preflight and startup, and that a valid
  # one yields a port completing a real TLS handshake. Stdlib-only; the TLS
  # steps shell out to `openssl` (present on ubuntu-latest) to mint a
  # throwaway cert, and report SKIP rather than FAIL if it is absent.
  ops-drill:
    name: Operations drill (--print-config, --preflight, RDB/AOF recovery, TLS)
    runs-on: ubuntu-latest
    if: >
      github.ref == 'refs/heads/main' ||
      github.base_ref == 'main' ||
      github.base_ref == 'master'
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ops-drill

      - name: Build release nexrade-cache
        run: cargo build --release -p nexrade-cache

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify openssl is available for the TLS drill steps
        # openssl is a *test-harness* dependency only: the drill shells out to
        # it to mint a throwaway certificate. nexrade-cache itself uses
        # rustls (aws-lc-rs) and links no libssl/libcrypto — serving TLS
        # needs no openssl on the host. Without it the drill reports SKIP,
        # which would silently reduce coverage on the one job that exercises
        # TLS end to end, so fail loudly here instead.
        run: openssl version

      - name: Run operator drill
        # Stdlib-only — no pip install needed for the drill itself.
        run: python3 scripts/operator_drill.py --binary ./target/release/nexrade-cache

  # ─── Security audit ─────────────────────────────────────────────────────────
  # Removed standalone cargo-audit job — cargo-deny (below) covers advisory
  # checks with proper ignore rules from deny.toml. Running both caused
  # failures when cargo-audit flagged advisories that deny.toml explicitly
  # allows (e.g. unmaintained-but-safe crates).

  # ─── Code coverage (cargo-llvm-cov) ─────────────────────────────────────────
  # Skipped on PRs — coverage doesn't block merge and takes ~15 min.
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust stable + llvm-tools
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: coverage
          cache-bin: false

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Generate coverage report
        run: cargo llvm-cov --workspace --all-features --lcov --output-path lcov.info

      - name: Upload to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: lcov.info
          fail_ci_if_error: false

  # ─── Fuzz build check (cargo-fuzz — compile only, no fuzzing in CI) ─────────
  # Skipped on PRs — nightly toolchain install adds ~8 min with little PR value.
  fuzz-build:
    name: Fuzz build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v6

      - name: Install nightly Rust (required by cargo-fuzz)
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: fuzz

      - name: Install cargo-fuzz
        # cargo-fuzz isn't in taiki-e/install-action's prebuilt-binary
        # manifest, so unlike cargo-llvm-cov above this still has to build
        # from source — but rust-cache above now covers the build cache too.
        run: |
          if ! command -v cargo-fuzz &>/dev/null; then
            cargo +nightly install cargo-fuzz --locked
          fi

      - name: Build fuzz targets (compile check only)
        # Explicitly use +nightly so the workspace's rust-toolchain.toml (which
        # pins stable for the rest of CI) does not override the fuzz build.
        run: cargo +nightly fuzz build resp_parser

  # ─── Smoke test — Linux + Windows (no macOS) ────────────────────────────────
  # Only runs on PRs/pushes targeting main — skipped on feature branches.
  smoke:
    name: Smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    if: >
      github.ref == 'refs/heads/main' ||
      github.base_ref == 'main' ||
      github.base_ref == 'master'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: smoke-${{ matrix.os }}

      # Debug build, not --release: a smoke test only needs the binary to
      # run, and skipping lto/codegen-units=1 (the release profile) cuts
      # this build from ~3-4 min to well under 1 min on a cold cache.
      - name: Build debug binary
        run: cargo build --package nexrade-cache

      - name: Smoke test — PING/PONG (Linux)
        if: runner.os != 'Windows'
        run: |
          ./target/debug/nexrade-cache --port 16399 &
          SERVER_PID=$!
          sleep 1
          ./target/debug/nexrade-cli -p 16399 PING
          kill $SERVER_PID 2>/dev/null || true

      - name: Smoke test — PING/PONG (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $job = Start-Job { & "$env:GITHUB_WORKSPACE\target\debug\nexrade-cache.exe" --port 16399 }
          Start-Sleep -Seconds 2
          $result = & "$env:GITHUB_WORKSPACE\target\debug\nexrade-cli.exe" -p 16399 PING
          Write-Host "CLI result: $result"
          Stop-Job $job; Remove-Job $job

  # ─── Dependency policy (cargo-deny) ─────────────────────────────────────────
  # Checks: security advisories, license compatibility, duplicate crates,
  # banned crates, and allowed source registries.  Supersedes cargo-audit for
  # advisory coverage and adds the licence + bans checks on top.
  #
  # Currently DISABLED — the cargo-deny 0.19.x bundled in
  # `EmbarkStudios/cargo-deny-action@v2` has a parser bug that crashes on
  # any advisory with a CVSS 4.0 vector (the advisory DB now ships ~50
  # such entries starting with RUSTSEC-2026-0076 in libcrux-ml-dsa).
  # Re-enable once cargo-deny supports CVSS 4.0. None of the affected
  # crates are in nexrade-cache's dep tree (verified with `cargo tree`).
  # deny:
  #   name: cargo-deny
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v6
  #     - uses: EmbarkStudios/cargo-deny-action@v2
  #       with:
  #         command: check

  # ─── MSRV (Minimum Supported Rust Version) ──────────────────────────────────
  # Skipped on PRs — a full double-build (~10 min) is better suited for main.
  msrv:
    name: MSRV (Rust 1.87)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust 1.87
        uses: dtolnay/rust-toolchain@1.87.0

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: msrv

      - name: Build (MSRV)
        run: cargo build --workspace

      - name: Test (MSRV)
        run: cargo test --workspace
